
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start application for testing
        run: |
          node app.js > app.log 2>&1 &
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              echo "Application is ready"
              break
            fi
            sleep 1
          done
          curl --fail http://localhost:3000

      - name: Run automated tests
        run: npm test

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/cicd-github-actions-docker:latest" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/cicd-github-actions-docker:${{ github.sha }}" \
            .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/cicd-github-actions-docker:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/cicd-github-actions-docker:${{ github.sha }}"
